name: TeraBox-SIN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node src/sin/cli.js methods >/dev/null
      - run: npm run html
      - run: npm pack --dry-run --json >/dev/null
      - run: npm ci --prefix browser-automation
      - run: npm test --prefix browser-automation
