name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

env:
  HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

jobs:
  publish:
    name: Publish NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for trusted publishing
        run: npm install --global 'npm@^11.5.1'
      - name: Verify release tag matches package version
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $EXPECTED" >&2
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Verify package
        run: npm pack --dry-run --json >/dev/null
      - name: Publish with bootstrap token
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Publish with npm trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --access public --provenance
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
